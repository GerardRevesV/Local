# L'stack del local: Home Assistant i el servidor Matter.
# Decisió: docs/domotica/decisio-stack.md · Fase A.6 de docs/domotica/fases.md
#
# ⚠️ AQUÍ HI HA DOS CONTENIDORS, I DECISIO-STACK.MD EN DEIA UN.
#    El motiu no és una preferència, és que el camí previst es va tancar:
#    el hub Tapo H110 fa servir el xifratge TPAP, i la biblioteca que porta
#    Home Assistant (python-kasa 0.10.2) només coneix KLAP, AES i XOR. La
#    integració «tplink» rebutja el hub amb «Unsupported device», i és un
#    problema obert d'upstream (python-kasa#1590), no una configuració nostra.
#
#    Les tres sortides eren: esperar upstream (sense data, i el calendari
#    acaba el març), un component de tercers per HACS (que decisio-stack.md
#    rebutjava expressament dins la finestra probatòria), o Matter.
#
#    Matter costa aquest segon contenidor, i a canvi l'accés al hub passa a
#    ser **completament local**: sense el núvol de Tapo, sense credencials
#    de compte i sense res que caduqui. És millor que el pla original.
#
#    (Des del 21/09/2026 el rebuig de HACS ja no és vigent —canvi d'objectiu
#    a decisio-stack.md—, però el que decanta Matter és que és local, i això
#    no ha canviat.)
#
# ⚠️ LA VERSIÓ ES FIXA. Res de «:latest» i res d'actualitzacions automàtiques.
#    Actualitzar és un acte deliberat: un commit que canvia l'etiqueta o el
#    digest, amb data, i que es desplega a mà. Una actualització trencada que
#    arribés sola deixaria el sistema caigut sense haver tocat res.
#
#    (Fins al 21/09/2026 deia «ES CONGELA FINS AL 10/03/2027». La congelació
#    va caure amb el canvi d'objectiu —decisio-stack.md—; la versió fixada no,
#    perquè el seu primer motiu mai no va ser la finestra probatòria.)
#
#    Per saber quina és l'estable d'avui i posar-la a sota:
#      curl -s https://version.home-assistant.io/stable.json \
#        | python3 -c "import sys,json; print(json.load(sys.stdin)['homeassistant']['generic-x86-64'])"

services:
  homeassistant:
    container_name: homeassistant
    # Fixada el 20/09/2026. S'actualitza només a posta (vegeu la capçalera).
    image: ghcr.io/home-assistant/home-assistant:2026.9.3
    restart: unless-stopped

    # ── Sostre de memòria ───────────────────────────────────────────────────
    # Mesurat el 21/09/2026: 436 MB en règim, **pic 609 MB**.
    #
    # El sostre NO hi és per estrènyer, hi és perquè una fuita d'HA no pugui
    # endur-se la màquina sencera —i amb ella el matter-server i l'històric.
    # Amb 4 GB soldats no hi ha camí d'ampliació: el marge es defensa aquí.
    #
    #   1.536 + 512 = 2.048 MB de sostre sumat, de 3.716 MB de RAM.
    #
    # Encara que els DOS contenidors toquessin sostre alhora, a l'amfitrió li
    # quedarien ~1.660 MB. Aquesta és la propietat que importa: el kernel mai
    # no ha de triar entre matar Home Assistant i matar-se ell.
    #
    # 1.536 MB són 2,5× el pic mesurat. Hi cap el creixement previsible —la
    # xarxa Matter poblada i dos anys de «recorder»— amb marge de sobres.
    #
    # ⚠️ NO hi posem «memswap_limit» A POSTA. Sense ell, Docker deixa el
    #    contenidor arribar a 2× el sostre comptant l'intercanvi, i per tant
    #    un pic puntual s'aguanta al swap en comptes de morir. La RAM de
    #    l'amfitrió ja queda protegida pel «mem_limit» tot sol, que és
    #    l'objectiu; matar HA per un pic de 30 segons seria pagar un forat a
    #    l'històric per res.
    #
    # ⚠️ I MAI «oom_kill_disable». Congela el contenidor en comptes de matar-lo:
    #    HA deixaria de gravar sense sortir, i «restart» no el rescataria.
    #
    # Quan el toqui: el kernel mata el procés dins del cgroup, el contenidor
    # surt amb codi 137 i «restart: unless-stopped» el torna a aixecar. Què
    # n'ha de quedar escrit → docs/domotica/home-assistant.md, «Quan el sostre
    # es toca». Verificació: scripts/comprova.sh.
    mem_limit: 1536m
    mem_reservation: 512m

    # Cal xarxa del host per al descobriment a la xarxa local (mDNS i difusió).
    # Amb xarxa pròpia de Docker, HA no veu ni el hub ni el servidor Matter.
    network_mode: host

    environment:
      - TZ=Europe/Madrid

    volumes:
      - ./config:/config
      - /etc/localtime:/etc/localtime:ro

    # Sense «privileged» i sense /dev: no hi ha cap ràdio USB.
    # Els sensors parlen amb el hub Tapo, i el hub parla per IP.
    # Si algun dia entra un coordinador USB, aquesta decisió es reobre.

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ───────────────────────────────────────────────────────────────────────────
  #  SERVIDOR MATTER — la via local cap al hub H110
  #
  #  Home Assistant no parla Matter tot sol: necessita aquest servei a part,
  #  que és qui manté la xarxa Matter i les claus dels aparells emparellats.
  # ───────────────────────────────────────────────────────────────────────────
  matter-server:
    container_name: matter-server
    # Fixada per DIGEST el 21/09/2026, no per etiqueta: la imatge no publica
    # cap etiqueta de versió i «stable» es mou sota els peus. Un digest és
    # immutable per construcció. S'actualitza només a posta.
    image: ghcr.io/home-assistant-libs/python-matter-server@sha256:170aa093ce91c76cde4cc390918307590f0f5558fcec93f913af3cb019e6562a
    restart: unless-stopped

    # ── Sostre de memòria ───────────────────────────────────────────────────
    # Mesurat el 21/09/2026: 88 MB en règim, pic 89 MB —pràcticament pla.
    #
    # ⚠️ Però mesurat amb la XARXA MATTER BUIDA: el hub encara no està
    #    emparellat. Els 512 MB (5,7× el pic) són justament per no haver de
    #    tornar a tocar aquest fitxer quan hi entrin el hub i els sis sensors.
    #    La xifra de consum, en canvi, SÍ que s'ha de tornar a mesurar
    #    després d'emparellar.
    #
    # Té sostre propi perquè és un procés a part amb la seva pròpia xarxa
    # Matter: si algun dia fuita, ha de caure ell sol i no arrossegar HA.
    mem_limit: 512m
    mem_reservation: 128m

    # Matter fa servir IPv6 i multidifusió a la xarxa local: sense xarxa del
    # host no pot ni descobrir ni emparellar res.
    network_mode: host

    # ── Quina interfície, per als enllaços locals ───────────────────────────
    # Els aparells Matter s'anuncien amb una adreça IPv6 «fe80::», que NO és
    # única per màquina sinó per ENLLAÇ: per enviar-hi res cal dir també per
    # quina interfície surt. I aquest amfitrió en té quatre amb adreça fe80:
    # enp1s0 (el cable), wlp0s20f3 (la Wi-Fi), docker0 (avall) i
    # tailscale0. Si el servidor tria la que no toca, els paquets se'n van a
    # un forat: l'aparell no contesta mai i l'emparellament mor amb
    # «PASESession timed out ... Expected message type was 33», que és
    # exactament el que va passar el 21/09/2026 cinc vegades seguides amb
    # el P110M.
    #
    # Des del 23/09/2026 el portàtil va per Wi-Fi, a la xarxa del router de
    # la SIM, i sense cable: la bona és wlp0s20f3. ⚠️ Amb el nom d'una
    # interfície sense enllaç, Matter no arriba a cap aparell. Si es torna al
    # cable, es torna a enp1s0 ABANS de treure la Wi-Fi, i al revés.
    #
    # Els dos primers arguments són el CMD per defecte de la imatge
    # (ENTRYPOINT=matter-server): posar «command» el substitueix sencer, i
    # sense ells el servidor perdria el magatzem i els certificats.
    #
    # ⚠️ Si algun dia es canvia de portàtil o de targeta de xarxa, aquest nom
    #    canvia. Es llegeix amb «ip -br addr».
    command:
      - --storage-path
      - /data
      - --paa-root-cert-dir
      - /data/credentials
      - --primary-interface
      - wlp0s20f3

    # Requisit documentat del projecte: sense això, el dimoni no pot fer
    # algunes operacions de xarxa sota AppArmor.
    security_opt:
      - apparmor=unconfined

    volumes:
      # ⚠️ Aquí hi viuen les CLAUS dels aparells emparellats. Perdre-ho
      #    obliga a reemparellar, i reemparellar parteix les sèries.
      #    Ha d'entrar a la còpia de seguretat igual que config/.storage.
      - ./matter-data:/data
      - /etc/localtime:/etc/localtime:ro

    # Sense /run/dbus a posta: només caldria per emparellar per Bluetooth, i
    # aquí no cal —el hub ja és a la xarxa— i a més el Bluetooth del portàtil
    # està desactivat expressament (vegeu scripts/prepara-host.sh).

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
