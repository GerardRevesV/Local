# ═════════════════════════════════════════════════════════════════════════════
#  TAULER DEL SOTERRANI — optimització de consum
#
#  L'objectiu d'aquest tauler és respondre UNA pregunta, de pressa i sense
#  interpretació: **ara mateix, val la pena obrir els ventiladors?**
#
#  Per això l'ordre és: primer la resposta, després el perquè, i al final les
#  dades crues. No al revés.
#
#  ⚠️ En YAML i versionat a posta. El que es crea des de la interfície viu a
#     `.storage/`, no es pot revisar en un PR i no es pot refer si es perd.
# ═════════════════════════════════════════════════════════════════════════════

title: Soterrani

views:
  # ───────────────────────────────────────────────────────────────────────────
  - title: Ara
    path: ara
    icon: mdi:gauge
    cards:

      # ── LA RESPOSTA ─────────────────────────────────────────────────────────
      #  La decisió v2 (packages/control.yaml): què fa, i què vol als aparells.
      #  En ombra, és el que FARIA: no s'actua sobre res.
      #  ⚠️ «content: |» i no «>»: la taula necessita un salt de línia per fila.
      - type: markdown
        content: |
          {%- set s = 'sensor.decisio_del_soterrani' -%}
          {%- set d = states(s) -%}
          {%- set m = state_attr(s, 'motiu') -%}
          {%- set act = state_attr(s, 'actuacio') or {} -%}
          {%- set ll = state_attr(s, 'llindar') -%}
          {%- set v = state_attr(s, 'ventiladors') -%}
          # {{ {'urgencia': '🚨 URGÈNCIA',
                'ventilar': '🌬️ VENTILAR',
                'higiene': "🔄 RENOVAR L'AIRE",
                'deshumidificar': '💧 DESHUMIDIFICAR',
                'repos': '✅ REPÒS',
                'ocupat': '🛏️ OCUPAT',
                'impressio': '🖨️ IMPRESSIÓ',
                'fix': '📌 LLINDAR FIX',
                'bloquejat': '⛔ BLOQUEJAT',
                'aturat': '⏸️ TOT ATURAT',
                'sense_dades': '❓ SENSE DADES',
                'calibratge': '🧪 CALIBRATGE'}.get(d, d) }}

          ### {{ m if m else '—' }}

          | | |
          |---|---|
          | **Deshumidificador** | {% if ll is number %}al **{{ ll }} %**, {{ 'mode Nit' if state_attr(s, 'mode_aparell') == 'sleep' else 'Manual, velocitat alta' }}{% else %}no es toca{% endif %} |
          | **Ventiladors** | {{ '**engegats**' if v == true else 'aturats' if v == false else 'no es toquen' }} |
          | **Mode** | {{ states('input_select.mode_soterrani') }}{% if is_state('timer.override_manual', 'active') %} · caduca a les {{ (state_attr('timer.override_manual', 'finishes_at') | as_datetime | as_local).strftime('%H:%M') }}{% endif %} |
          | **Tram** | {{ state_attr(s, 'tram') or '—' }} · llindar del tram: {{ state_attr(s, 'llindar_tram') or '—' }} % |

          {% if d == 'calibratge' -%}
          Els cinc sensors estan **junts per calibrar-los**, no al seu lloc.
          Cap lectura d'aquesta pantalla vol dir res del soterrani.
          {%- elif not act.get('deshumidificador') and not act.get('ventiladors') -%}
          🌓 **En ombra**: és el que **faria**. No s'actua sobre cap aparell
          (Ajustos → *Actuar*).
          {%- endif %}

      # ── ELS NÚMEROS QUE DECIDEIXEN ──────────────────────────────────────────
      #  Els dos ΔTd: la referència la tria input_select.referencia_ventilacio,
      #  però es graven tots dos per saber quin encerta. Els colors són els
      #  llindars de partida (0,8 i 2,0 °C): una targeta no llegeix paràmetres.
      - type: grid
        columns: 2
        square: false
        cards:
          - type: gauge
            entity: sensor.dtd_interior_planta_baixa
            name: ΔTd · contra la planta baixa
            unit: °C
            min: -6
            max: 6
            needle: true
            severity:
              red: -6
              yellow: 0.8
              green: 2.0
          - type: gauge
            entity: sensor.dtd_interior_exterior
            name: ΔTd · contra fora
            unit: °C
            min: -6
            max: 6
            needle: true
            severity:
              red: -6
              yellow: 0.8
              green: 2.0

      - type: entities
        title: Els números que decideixen
        entities:
          - entity: sensor.soterrani_humitat_maxima
            name: HR del pitjor racó (calibrada)
          - type: attribute
            entity: sensor.soterrani_humitat_maxima
            attribute: punt
            name: Quin racó
          - entity: sensor.marge_de_condensacio
            name: Marge de la paret
          - type: divider
          - entity: sensor.soterrani_punt_de_rosada_de_referencia
            name: Td interior (el punt més humit)
          - entity: sensor.planta_baixa_punt_de_rosada
            name: Td de la planta baixa
          - entity: sensor.exterior_punt_de_rosada
            name: Td de fora
          - type: attribute
            entity: sensor.decisio_del_soterrani
            attribute: punt_mes_humit
            name: Racó més humit (per Td)
          - type: divider
          - entity: sensor.ventilacio_minuts_avui
            name: Minuts de ventilació avui
          - type: attribute
            entity: sensor.decisio_del_soterrani
            attribute: higiene_pendent
            name: Minuts de renovació que falten
            suffix: min

      # ── ELS PUNTS, UN A UN ──────────────────────────────────────────────────
      - type: entities
        title: Soterrani
        state_color: true
        entities:
          - type: section
            label: Fons
          - entity: sensor.soterrani_fons_temperatura
            name: Temperatura
          - entity: sensor.soterrani_fons_humitat
            name: Humitat
          - entity: sensor.soterrani_fons_punt_de_rosada
            name: Punt de rosada
          - type: section
            label: Centre
          - entity: sensor.soterrani_centre_temperatura
            name: Temperatura
          - entity: sensor.soterrani_centre_humitat
            name: Humitat
          - entity: sensor.soterrani_centre_punt_de_rosada
            name: Punt de rosada
          - type: section
            label: Gran
          - entity: sensor.soterrani_gran_temperatura
            name: Temperatura
          - entity: sensor.soterrani_gran_humitat
            name: Humitat
          - entity: sensor.soterrani_gran_punt_de_rosada
            name: Punt de rosada
          - type: divider
          - entity: binary_sensor.soterrani_inundacio
            name: Sensor d'inundació

      - type: entities
        title: Planta baixa i exterior
        entities:
          - type: section
            label: Dalt
          - entity: sensor.baixa_temperatura
            name: Temperatura
          - entity: sensor.baixa_humitat
            name: Humitat
          - entity: sensor.planta_baixa_punt_de_rosada
            name: Punt de rosada
          - type: section
            label: Fora
          - entity: sensor.exterior_temperatura
            name: Temperatura
          - entity: sensor.exterior_humitat
            name: Humitat
          - entity: sensor.exterior_punt_de_rosada
            name: Punt de rosada

  # ───────────────────────────────────────────────────────────────────────────
  - title: Històric
    path: historic
    icon: mdi:chart-line
    cards:

      # El gràfic que ho explica tot: quan la línia de dalt o de fora va per
      # sota de la de dins, ventilar asseca. La distància és el ΔTd.
      - type: history-graph
        title: Punt de rosada — dins, la planta baixa i fora
        hours_to_show: 48
        entities:
          - entity: sensor.soterrani_punt_de_rosada_de_referencia
            name: Interior (referència)
          - entity: sensor.planta_baixa_punt_de_rosada
            name: Planta baixa
          - entity: sensor.exterior_punt_de_rosada
            name: Exterior

      # Les dues referències, juntes: amb unes setmanes, quina prediu millor
      # que ventilar asseca (logica-v2.md). La que decideix és la de Ajustos.
      - type: history-graph
        title: ΔTd — per sobre de 2 °C, ventilar surt a compte
        hours_to_show: 48
        entities:
          - entity: sensor.dtd_interior_planta_baixa
            name: Contra la planta baixa
          - entity: sensor.dtd_interior_exterior
            name: Contra fora

      # El segon nivell de la v2, a la vista: el pitjor racó contra el llindar
      # que la decisió vol a l'aparell. Tots dos en %, al mateix eix.
      - type: history-graph
        title: El pitjor racó contra el llindar del deshumidificador
        hours_to_show: 48
        entities:
          - entity: sensor.soterrani_humitat_maxima
            name: HR del pitjor racó
          - entity: sensor.decisio_llindar_deshumidificador
            name: Llindar que vol la decisió

      - type: history-graph
        title: Decisió
        hours_to_show: 48
        entities:
          - entity: sensor.decisio_del_soterrani
            name: Estat
          - entity: binary_sensor.decisio_ventiladors
            name: Ventiladors
          - entity: input_select.mode_soterrani
            name: Mode

      # Els watts, amb la mateixa finestra que la resta (R3 de requisits.md):
      # les bandes de funcionament surten de la potència, no de l'estat de
      # l'endoll. Els kWh i els euros són a la vista «Consum».
      - type: history-graph
        title: Potència de l'endoll
        hours_to_show: 48
        entities:
          - entity: sensor.deshumidificador_potencia
            name: Potència

      - type: history-graph
        title: Els tres punts del soterrani — on és el problema
        hours_to_show: 48
        entities:
          - entity: sensor.soterrani_fons_punt_de_rosada
            name: Fons
          - entity: sensor.soterrani_centre_punt_de_rosada
            name: Centre
          - entity: sensor.soterrani_gran_punt_de_rosada
            name: Gran

      - type: history-graph
        title: Humitat relativa
        hours_to_show: 48
        entities:
          - entity: sensor.soterrani_fons_humitat
            name: Fons
          - entity: sensor.soterrani_centre_humitat
            name: Centre
          - entity: sensor.soterrani_gran_humitat
            name: Gran
          - entity: sensor.exterior_humitat
            name: Fora

      - type: history-graph
        title: Temperatura
        hours_to_show: 48
        entities:
          - entity: sensor.soterrani_fons_temperatura
            name: Fons
          - entity: sensor.soterrani_centre_temperatura
            name: Centre
          - entity: sensor.soterrani_gran_temperatura
            name: Gran
          - entity: sensor.baixa_temperatura
            name: Dalt
          - entity: sensor.exterior_temperatura
            name: Fora

  # ───────────────────────────────────────────────────────────────────────────
  #  CONSUM — què gasta l'endoll, i quant costa amb els trams de la factura.
  #  Lògica: config/packages/consum.yaml. Calendari: custom_templates/tarifa.jinja
  #
  #  Les barres surten de les ESTADÍSTIQUES d'HA, que no es purguen mai: per
  #  això valen igual per a les últimes 48 hores que per a l'últim any.
  # ───────────────────────────────────────────────────────────────────────────
  - title: Consum
    path: consum
    icon: mdi:lightning-bolt
    cards:

      - type: entities
        title: Ara
        entities:
          - entity: sensor.deshumidificador_potencia
            name: Potència
          - entity: sensor.tarifa_periode
            name: Tram
          - entity: sensor.tarifa_preu
            name: Preu del kWh, amb impostos
          - type: divider
          - entity: sensor.deshumidificador_energia_diaria
            name: Energia avui
          - entity: sensor.deshumidificador_energia_mensual
            name: Energia aquest mes

      - type: grid
        columns: 2
        square: false
        cards:
          - type: statistic
            entity: sensor.deshumidificador_cost
            name: Cost avui
            stat_type: change
            period:
              calendar:
                period: day
          - type: statistic
            entity: sensor.deshumidificador_cost
            name: Cost aquest mes
            stat_type: change
            period:
              calendar:
                period: month

      # Els watts amb el tram a sota: es veu d'un cop d'ull si el consum cau
      # en punta o en vall.
      - type: history-graph
        title: Potència i tram
        hours_to_show: 48
        entities:
          - entity: sensor.deshumidificador_potencia
            name: Potència
          - entity: sensor.tarifa_periode
            name: Tram

      - type: statistics-graph
        title: Energia per hora
        chart_type: bar
        period: hour
        days_to_show: 2
        stat_types:
          - change
        entities:
          - entity: sensor.deshumidificador_energia
            name: Energia

      - type: statistics-graph
        title: Cost per hora
        chart_type: bar
        period: hour
        days_to_show: 2
        stat_types:
          - change
        entities:
          - entity: sensor.deshumidificador_cost
            name: Cost

      # La pregunta de l'optimització: quina part del consum cau en punta.
      - type: statistics-graph
        title: Energia per dia i tram
        chart_type: bar
        period: day
        days_to_show: 30
        stat_types:
          - change
        entities:
          - entity: sensor.deshumidificador_energia_punta
            name: Punta
          - entity: sensor.deshumidificador_energia_pla
            name: Pla
          - entity: sensor.deshumidificador_energia_vall
            name: Vall

      - type: statistics-graph
        title: Cost per dia
        chart_type: bar
        period: day
        days_to_show: 30
        stat_types:
          - change
        entities:
          - entity: sensor.deshumidificador_cost
            name: Cost

      - type: markdown
        content: >
          ### Com es llegeix

          - **W**: el que mesura l'endoll ara. **kWh**: el comptador del mateix
          endoll, que integra la potència per dins.

          - **€**: una lectura d'aquell comptador **cada 5 minuts**. Totes les
          fronteres de tram cauen en hora en punt, o sigui que cada bloc de 5
          minuts té **un sol preu** i el càlcul és exacte. Els euros van fins a
          **5 minuts endarrerits** respecte dels watts.

          - Preus **amb** l'impost elèctric i l'IVA. **Sense** el terme de
          potència ni el lloguer del comptador: són fixos, no depenen del que
          s'hi endolli.

          - **Vall** tot el dia els dissabtes, diumenges i festius nacionals de
          data fixa. Divendres Sant i els festius catalans **no** ho són.

          {% if is_state('input_boolean.mode_calibratge', 'on') %}
          🧪 **Calibratge en marxa:** el consum és el del que hi hagi endollat
          ara, no necessàriament el del deshumidificador.
          {% endif %}

  # ───────────────────────────────────────────────────────────────────────────
  - title: Ajustos
    path: ajustos
    icon: mdi:tune
    cards:

      - type: entities
        title: Mode
        entities:
          - entity: input_select.mode_soterrani
            name: Mode del soterrani
          - entity: timer.override_manual
            name: Caducitat del mode
          - entity: input_select.referencia_ventilacio
            name: Referència per ventilar
          - type: section
            label: Actuar — apagat, la decisió només es grava (ombra)
          - entity: input_boolean.actuacio_deshumidificador
            name: Actuar sobre el deshumidificador
          - entity: input_boolean.actuacio_ventiladors
            name: Actuar sobre els ventiladors

      - type: markdown
        content: >
          ### Els modes

          **Òptim**, el de cada dia. **Ocupat** (12 h): ventilació contínua i
          l'aparell en mode Nit. **Prioritzar ventilació** (4 h): renova encara
          que costi. **Assecat intensiu** (12 h): al 50 %, sigui quin sigui el
          preu. **Silenci** (10 h): res de ventiladors, aparell en Nit.
          **Impressió** (3 h): ventilació contínua, fins i tot amb fred.
          **Absència**: menys renovació. **Llindar fix**: l'aparell a un
          llindar fix, per a la setmana de base. **Tot aturat**: manteniment,
          cap ordre. Els que caduquen tornen sols a *Òptim*. La **urgència**
          passa per davant de tots, menys de *Tot aturat*.

          ### Els llindars

          Són **hipòtesis de partida** (logica-v2.md): es corregiran amb les
          dades que la mateixa lògica deixa cada dia.

          ⚠️ **`Δ d'arrencada` ha de ser més gran que `Δ d'aturada`.** Si es
          creuen, la decisió passa a *bloquejat* i no es ventila per ΔTd.

      - type: entities
        title: Deshumidificador — llindar per tram (cost per litre)
        entities:
          - entity: input_number.hr_vall
            name: En vall
          - entity: input_number.hr_pla
            name: En pla
          - entity: input_number.hr_punta
            name: En punta
          - entity: input_number.hr_mentre_ventila
            name: Mentre ventila
          - entity: input_number.hr_fix
            name: En mode «Llindar fix»

      - type: entities
        title: Urgència — passa per davant del preu
        entities:
          - entity: input_number.hr_urgencia
            name: HR del pitjor racó que és urgència
          - entity: input_number.hr_urgencia_objectiu
            name: On asseca la urgència
          - entity: input_number.marge_superficie_min
            name: Marge mínim de la paret

      - type: entities
        title: Ventilació
        entities:
          - entity: input_number.delta_td_on
            name: Δ d'arrencada — per sobre d'això, ventilar
          - entity: input_number.delta_td_off
            name: Δ d'aturada — per sota, parar
          - entity: input_number.delta_td_higiene
            name: Δ a partir del qual renovar no mulla
          - type: divider
          - entity: input_number.renovacions_dia
            name: Renovacions al dia
          - entity: input_number.renovacions_absencia
            name: Renovacions al dia en «Absència»
          - entity: input_number.cabal_ventiladors
            name: Cabal dels ventiladors (hipotètic)
          - entity: input_number.volum_soterrani
            name: Volum del soterrani

      - type: entities
        title: Bloquejos de seguretat
        entities:
          - entity: input_number.t_int_minima
            name: Temperatura interior mínima per ventilar
          - entity: input_number.hr_ext_bloqueig
            name: HR exterior que bloqueja (només amb «Exterior»)

      - type: entities
        title: Protecció dels relés (Fase 3)
        entities:
          - entity: input_number.min_on_ventilador
            name: Temps mínim d'engegada del ventilador
          - entity: input_number.min_off_ventilador
            name: Temps mínim d'aturada del ventilador
