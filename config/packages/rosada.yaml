# ═════════════════════════════════════════════════════════════════════════════
#  LA FÍSICA DEL SOTERRANI — punts de rosada, ΔTd, HR màxima i marge
#  Fase B.4 de docs/domotica/fases.md · Disseny: docs/domotica/control-punt-rosada.md
#
#  Aquí es MESURA i es calcula; no es decideix res. Des del 22/09/2026, la
#  decisió (sensor.decisio_del_soterrani), els paràmetres i els modes viuen a
#  packages/control.yaml, amb la lògica v2 (docs/domotica/logica-v2-pla.md).
#
#  Els ventiladors segueixen en el seu règim actual (clàusula QUINTA).
# ═════════════════════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────────────────────
#  ELS PARÀMETRES, EL MODE I LA SEVA CADUCITAT s'han mogut a
#  packages/control.yaml (22/09/2026), amb el mateix nom: la sèrie no es
#  parteix. Allà hi ha també per què ja no porten «initial:» (R2).
# ─────────────────────────────────────────────────────────────────────────────
input_boolean:
  # ───────────────────────────────────────────────────────────────────────────
  #  MODE CALIBRATGE
  #
  #  S'engega mentre els sensors estan TOTS JUNTS per calibrar-los, i es torna
  #  a apagar en repartir-los. Mentre està encès, sensor.decisio_del_soterrani
  #  val «calibratge» i, per tant, cap automatisme no actua: llegeixen aquella
  #  decisió i prou (vegeu el principi d'arquitectura de control.yaml).
  #
  #  ⚠️ És un helper i per tant queda REGISTRAT a l'històric. Aquest és tot el
  #     truc: d'aquí a un any, l'arxiu explica sol per què hi ha un tram on
  #     cinc sensors del soterrani deien el mateix des d'una taula del menjador.
  #     Per això es MARCA el període en comptes d'apartar-ne les dades: la
  #     desviació entre sensors només es pot mesurar una vegada, i perdre'n la
  #     procedència seria pitjor que tenir-la barrejada.
  #
  #  El procediment és a docs/domotica/calibratge.md.
  # ───────────────────────────────────────────────────────────────────────────
  mode_calibratge:
    name: Mode calibratge (sensors junts)
    icon: mdi:flask-outline
    # ⚠️ SENSE «initial:» a posta, i aquí el motiu importa més que de costum.
    #    Amb «initial: off» l'helper arrencaria APAGAT a cada reinici d'HA
    #    (vegeu la nota de R2 a control.yaml). Enmig d'una prova de 36 h, un
    #    desplegament o un tall de corrent l'apagarien sol: la finestra
    #    semblaria acabada, la decisió tornaria a actuar i l'arxiu etiquetaria
    #    malament mitja prova, sense que ningú se n'assabentés.
    #    Sense «initial:» restaura l'estat previ. I si mai no en té cap, val
    #    «off» o «unknown», i totes dues coses donen funcionament normal:
    #    la fallada, si n'hi ha, cau del costat segur.

# ═════════════════════════════════════════════════════════════════════════════
#  SENSORS DE PLANTILLA
# ═════════════════════════════════════════════════════════════════════════════
template:
  # ───────────────────────────────────────────────────────────────────────────
  #  PUNTS DE ROSADA — fórmula de Magnus, coeficients d'Alduchov & Eskridge 1996
  #
  #  Td = (b·γ) / (a − γ)   amb   γ = ln(HR/100) + (a·T)/(b + T)
  #  a = 17,625   b = 243,04 °C   ·   error de la fórmula: ±0,1 °C
  #
  #  ⚠️ CALIBRATGE: els desplaçaments de la taula «offsets» surten de deixar tots
  #     els sensors 24 h junts a la mateixa habitació i mesurar-ne la desviació
  #     respecte de la mediana (fase A.13). Viuen AQUÍ, en codi versionat, i no
  #     com a helpers editables: canviar un calibratge ha de ser un acte
  #     deliberat, datat i revisable, perquè afecta el corpus probatori.
  #
  #  ⚠️ Les lectures CRUES no es toquen mai. El desplaçament s'aplica només al
  #     càlcul derivat. Així l'arxiu conserva la mesura i la correcció per separat.
  # ───────────────────────────────────────────────────────────────────────────
  - sensor:
      - name: "Soterrani fons — punt de rosada"
        unique_id: soterrani_fons_rosada
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        availability: >
          {{ is_number(states('sensor.soterrani_fons_temperatura'))
             and is_number(states('sensor.soterrani_fons_humitat')) }}
        state: >
          {#- CALIBRATGE: c_t °C, i HR corregida com a c_rh_a·HR + c_rh_b.
              (0, 1, 0) = identitat = encara SENSE calibrar. Els posa
              tools/calibratge.py; el procediment i el rang de validesa,
              a docs/domotica/calibratge.md. -#}
          {% set c_t = 0.0 %}{% set c_rh_a = 1.0 %}{% set c_rh_b = 0.0 %}
          {% set t  = (states('sensor.soterrani_fons_temperatura') | float + 0.0) + c_t %}
          {% set rh = (states('sensor.soterrani_fons_humitat')     | float + 0.0) * c_rh_a + c_rh_b %}
          {% set rh = [[rh, 1] | max, 100] | min %}
          {% set a = 17.625 %}{% set b = 243.04 %}
          {% set g = log(rh / 100) + (a * t) / (b + t) %}
          {{ ((b * g) / (a - g)) | round(2) }}

      - name: "Soterrani centre — punt de rosada"
        unique_id: soterrani_centre_rosada
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        availability: >
          {{ is_number(states('sensor.soterrani_centre_temperatura'))
             and is_number(states('sensor.soterrani_centre_humitat')) }}
        state: >
          {#- CALIBRATGE: c_t °C, i HR corregida com a c_rh_a·HR + c_rh_b.
              (0, 1, 0) = identitat = encara SENSE calibrar. Els posa
              tools/calibratge.py; el procediment i el rang de validesa,
              a docs/domotica/calibratge.md. -#}
          {% set c_t = 0.0 %}{% set c_rh_a = 1.0 %}{% set c_rh_b = 0.0 %}
          {% set t  = (states('sensor.soterrani_centre_temperatura') | float + 0.0) + c_t %}
          {% set rh = (states('sensor.soterrani_centre_humitat')     | float + 0.0) * c_rh_a + c_rh_b %}
          {% set rh = [[rh, 1] | max, 100] | min %}
          {% set a = 17.625 %}{% set b = 243.04 %}
          {% set g = log(rh / 100) + (a * t) / (b + t) %}
          {{ ((b * g) / (a - g)) | round(2) }}

      - name: "Soterrani gran — punt de rosada"
        unique_id: soterrani_gran_rosada
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        availability: >
          {{ is_number(states('sensor.soterrani_gran_temperatura'))
             and is_number(states('sensor.soterrani_gran_humitat')) }}
        state: >
          {#- CALIBRATGE: c_t °C, i HR corregida com a c_rh_a·HR + c_rh_b.
              (0, 1, 0) = identitat = encara SENSE calibrar. Els posa
              tools/calibratge.py; el procediment i el rang de validesa,
              a docs/domotica/calibratge.md. -#}
          {% set c_t = 0.0 %}{% set c_rh_a = 1.0 %}{% set c_rh_b = 0.0 %}
          {% set t  = (states('sensor.soterrani_gran_temperatura') | float + 0.0) + c_t %}
          {% set rh = (states('sensor.soterrani_gran_humitat')     | float + 0.0) * c_rh_a + c_rh_b %}
          {% set rh = [[rh, 1] | max, 100] | min %}
          {% set a = 17.625 %}{% set b = 243.04 %}
          {% set g = log(rh / 100) + (a * t) / (b + t) %}
          {{ ((b * g) / (a - g)) | round(2) }}

      - name: "Planta baixa — punt de rosada"
        unique_id: baixa_rosada
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        availability: >
          {{ is_number(states('sensor.baixa_temperatura'))
             and is_number(states('sensor.baixa_humitat')) }}
        state: >
          {#- CALIBRATGE: c_t °C, i HR corregida com a c_rh_a·HR + c_rh_b.
              (0, 1, 0) = identitat = encara SENSE calibrar. Els posa
              tools/calibratge.py; el procediment i el rang de validesa,
              a docs/domotica/calibratge.md. -#}
          {% set c_t = 0.0 %}{% set c_rh_a = 1.0 %}{% set c_rh_b = 0.0 %}
          {% set t  = (states('sensor.baixa_temperatura') | float + 0.0) + c_t %}
          {% set rh = (states('sensor.baixa_humitat')     | float + 0.0) * c_rh_a + c_rh_b %}
          {% set rh = [[rh, 1] | max, 100] | min %}
          {% set a = 17.625 %}{% set b = 243.04 %}
          {% set g = log(rh / 100) + (a * t) / (b + t) %}
          {{ ((b * g) / (a - g)) | round(2) }}

      - name: "Exterior — punt de rosada"
        unique_id: exterior_rosada
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        availability: >
          {{ is_number(states('sensor.exterior_temperatura'))
             and is_number(states('sensor.exterior_humitat')) }}
        state: >
          {#- CALIBRATGE: c_t °C, i HR corregida com a c_rh_a·HR + c_rh_b.
              (0, 1, 0) = identitat = encara SENSE calibrar. Els posa
              tools/calibratge.py; el procediment i el rang de validesa,
              a docs/domotica/calibratge.md. -#}
          {% set c_t = 0.0 %}{% set c_rh_a = 1.0 %}{% set c_rh_b = 0.0 %}
          {% set t  = (states('sensor.exterior_temperatura') | float + 0.0) + c_t %}
          {% set rh = (states('sensor.exterior_humitat')     | float + 0.0) * c_rh_a + c_rh_b %}
          {% set rh = [[rh, 1] | max, 100] | min %}
          {% set a = 17.625 %}{% set b = 243.04 %}
          {% set g = log(rh / 100) + (a * t) / (b + t) %}
          {{ ((b * g) / (a - g)) | round(2) }}

      # ─────────────────────────────────────────────────────────────────────
      #  REFERÈNCIA INTERIOR = el punt de rosada MÉS ALT dels tres del soterrani.
      #  No la mitjana: la condensació és local i una mitjana amaga el racó que
      #  té el problema. Vegeu docs/domotica/noms-entitats.md.
      # ─────────────────────────────────────────────────────────────────────
      - name: "Soterrani — punt de rosada de referència"
        unique_id: soterrani_rosada
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        availability: >
          {{ [ states('sensor.soterrani_fons_punt_de_rosada'),
               states('sensor.soterrani_centre_punt_de_rosada'),
               states('sensor.soterrani_gran_punt_de_rosada') ]
             | select('is_number') | list | count > 0 }}
        state: >
          {{ [ states('sensor.soterrani_fons_punt_de_rosada'),
               states('sensor.soterrani_centre_punt_de_rosada'),
               states('sensor.soterrani_gran_punt_de_rosada') ]
             | select('is_number') | map('float') | max | round(2) }}
        attributes:
          punt_mes_humit: >
            {% set d = {
                 'fons':   states('sensor.soterrani_fons_punt_de_rosada'),
                 'centre': states('sensor.soterrani_centre_punt_de_rosada'),
                 'gran':   states('sensor.soterrani_gran_punt_de_rosada') } %}
            {# ⚠️ Res de `sort(attribute='1')`: states() torna CADENES i Jinja les
               ordena alfabèticament. Amb 9.50 i 10.20 deia «9.50» perquè '9' > '1'.
               Just el rang d'un soterrani a l'hivern, i just l'afirmació més
               pericial del sistema: quin racó és el dolent. Es compara en float. #}
            {% set ns = namespace(nom='cap', td=-999.0) %}
            {% for k, s in d.items() %}
              {% if s | is_number and (s | float) > ns.td %}
                {% set ns.nom = k %}{% set ns.td = s | float %}
              {% endif %}
            {% endfor %}
            {{ ns.nom }}
          dispersio: >
            {% set v = [ states('sensor.soterrani_fons_punt_de_rosada'),
                         states('sensor.soterrani_centre_punt_de_rosada'),
                         states('sensor.soterrani_gran_punt_de_rosada') ]
                       | select('is_number') | map('float') | list %}
            {{ (v | max - v | min) | round(2) if v | count > 1 else none }}

      # ─────────────────────────────────────────────────────────────────────
      #  ΔTd = interior − exterior.  Positiu = fora asseca. És una de les dues
      #  referències de la v2; l'altra, la planta baixa, és més avall.
      # ─────────────────────────────────────────────────────────────────────
      - name: "ΔTd interior − exterior"
        unique_id: delta_rosada
        unit_of_measurement: "°C"
        state_class: measurement
        availability: >
          {{ is_number(states('sensor.soterrani_punt_de_rosada_de_referencia'))
             and is_number(states('sensor.exterior_punt_de_rosada')) }}
        state: >
          {{ (states('sensor.soterrani_punt_de_rosada_de_referencia') | float
              - states('sensor.exterior_punt_de_rosada') | float) | round(2) }}

      # ─────────────────────────────────────────────────────────────────────
      #  EL KPI QUE DECIDEIX EL CAS: marge entre la paret més freda i el punt
      #  de rosada de l'aire. Per sota de ~3 °C el fong ja hi té condicions.
      #  Font: ESPHome (fase B.2). Mentre no hi sigui, queda «unavailable»,
      #  i la lògica ho tracta com a «sense dada», no com a zero.
      # ─────────────────────────────────────────────────────────────────────
      - name: "Marge de condensació"
        unique_id: marge_condensacio
        unit_of_measurement: "°C"
        state_class: measurement
        availability: >
          {{ is_number(states('sensor.soterrani_punt_de_rosada_de_referencia'))
             and ([ states('sensor.soterrani_paret_1_superficie'),
                    states('sensor.soterrani_paret_2_superficie') ]
                  | select('is_number') | list | count > 0) }}
        state: >
          {% set parets = [ states('sensor.soterrani_paret_1_superficie'),
                            states('sensor.soterrani_paret_2_superficie') ]
                          | select('is_number') | map('float') | list %}
          {{ (parets | min - states('sensor.soterrani_punt_de_rosada_de_referencia') | float) | round(2) }}

      # ─────────────────────────────────────────────────────────────────────
      #  SALUT DEL SENSOR EXTERIOR — idea de l'usuari (20/09/2026).
      #  Residu contra l'estació oficial. Ha de ser petit i ESTABLE; quan
      #  comenci a derivar, el sensor s'ha mullat, embrutat o s'està morint,
      #  i ho sabrem setmanes abans que decideixi malament.
      #  Es compara el punt de rosada, no la T ni l'HR: és propietat de la
      #  massa d'aire i per tant comparable a quilòmetres de distància.
      # ─────────────────────────────────────────────────────────────────────
      - name: "Residu del punt de rosada exterior"
        unique_id: residu_rosada_exterior
        unit_of_measurement: "°C"
        state_class: measurement
        availability: >
          {{ is_number(states('sensor.exterior_punt_de_rosada'))
             and is_number(states('sensor.aemet_dew_point')) }}
        state: >
          {{ (states('sensor.exterior_punt_de_rosada') | float
              - states('sensor.aemet_dew_point') | float) | round(2) }}


      # ─────────────────────────────────────────────────────────────────────
      #  L'ALTRA REFERÈNCIA: ΔTd = interior − planta baixa (logica-v2.md).
      #  Els ventiladors extreuen i l'aire de reposició baixa per l'escala: el
      #  que entra al soterrani hauria de ser el de la planta baixa. Es graven
      #  tots dos ΔTd, triï el que triï input_select.referencia_ventilacio,
      #  per saber amb dades quin prediu millor l'efecte de ventilar.
      # ─────────────────────────────────────────────────────────────────────
      - name: "ΔTd interior − planta baixa"
        unique_id: delta_rosada_planta_baixa
        default_entity_id: sensor.dtd_interior_planta_baixa
        unit_of_measurement: "°C"
        state_class: measurement
        availability: >
          {{ is_number(states('sensor.soterrani_punt_de_rosada_de_referencia'))
             and is_number(states('sensor.planta_baixa_punt_de_rosada')) }}
        state: >
          {{ (states('sensor.soterrani_punt_de_rosada_de_referencia') | float
              - states('sensor.planta_baixa_punt_de_rosada') | float) | round(2) }}

      # ─────────────────────────────────────────────────────────────────────
      #  LA HR MÉS ALTA DELS TRES PUNTS — la que mira la urgència de la v2.
      #  El pitjor racó per punt de rosada no és sempre el pitjor per HR, i el
      #  fong el marca la HR (a tocar de la paret, quan hi hagi la sonda).
      #
      #  És la HR CALIBRADA: es desfà Magnus amb el Td calibrat de cada punt i
      #  la seva temperatura. ⚠️ Exacte perquè el calibratge de T dels tres
      #  punts (c_t) és zero —la T no es corregeix, calibratge.md—. Si mai no
      #  ho fos, caldria sumar-l'hi aquí: tools/replica.py ho vigila i falla.
      # ─────────────────────────────────────────────────────────────────────
      - name: "Soterrani — humitat màxima"
        unique_id: soterrani_humitat_maxima
        default_entity_id: sensor.soterrani_humitat_maxima
        unit_of_measurement: "%"
        device_class: humidity
        state_class: measurement
        availability: >
          {{ (is_number(states('sensor.soterrani_fons_punt_de_rosada'))
              and is_number(states('sensor.soterrani_fons_temperatura')))
             or (is_number(states('sensor.soterrani_centre_punt_de_rosada'))
              and is_number(states('sensor.soterrani_centre_temperatura')))
             or (is_number(states('sensor.soterrani_gran_punt_de_rosada'))
              and is_number(states('sensor.soterrani_gran_temperatura'))) }}
        state: >
          {% set a = 17.625 %}{% set b = 243.04 %}
          {% set punts = {
               'fons':   [states('sensor.soterrani_fons_punt_de_rosada'),
                          states('sensor.soterrani_fons_temperatura')],
               'centre': [states('sensor.soterrani_centre_punt_de_rosada'),
                          states('sensor.soterrani_centre_temperatura')],
               'gran':   [states('sensor.soterrani_gran_punt_de_rosada'),
                          states('sensor.soterrani_gran_temperatura')] } %}
          {% set ns = namespace(hr=-1.0) %}
          {% for nom, v in punts.items() if v[0] | is_number and v[1] | is_number %}
            {% set td = v[0] | float %}{% set t = v[1] | float %}
            {% set ns.hr = [ns.hr, 100 * e ** (a * td / (b + td) - a * t / (b + t))] | max %}
          {% endfor %}
          {{ ([ns.hr, 100] | min) | round(1) }}
        attributes:
          punt: >
            {% set a = 17.625 %}{% set b = 243.04 %}
            {% set punts = {
                 'fons':   [states('sensor.soterrani_fons_punt_de_rosada'),
                            states('sensor.soterrani_fons_temperatura')],
                 'centre': [states('sensor.soterrani_centre_punt_de_rosada'),
                            states('sensor.soterrani_centre_temperatura')],
                 'gran':   [states('sensor.soterrani_gran_punt_de_rosada'),
                            states('sensor.soterrani_gran_temperatura')] } %}
            {% set ns = namespace(hr=-1.0, punt='cap') %}
            {% for nom, v in punts.items() if v[0] | is_number and v[1] | is_number %}
              {% set td = v[0] | float %}{% set t = v[1] | float %}
              {% set hr = 100 * e ** (a * td / (b + td) - a * t / (b + t)) %}
              {% if hr > ns.hr %}{% set ns.hr = hr %}{% set ns.punt = nom %}{% endif %}
            {% endfor %}
            {{ ns.punt }}

      # ─────────────────────────────────────────────────────────────────────
      #  LA DISPERSIÓ DELS TRES PUNTS: Td més alt − Td més baix. Diu si la
      #  humitat és general o d'un racó, que és on el deshumidificador pot
      #  estar mal posat, i si val la pena remenar l'aire. Ja era un atribut
      #  de la referència; com a sensor, fa estadístiques i es pot dibuixar.
      # ─────────────────────────────────────────────────────────────────────
      - name: "Soterrani — dispersió del punt de rosada"
        unique_id: soterrani_dispersio_rosada
        default_entity_id: sensor.soterrani_dispersio_rosada
        unit_of_measurement: "°C"
        state_class: measurement
        icon: mdi:arrow-expand-vertical
        availability: >
          {{ [ states('sensor.soterrani_fons_punt_de_rosada'),
               states('sensor.soterrani_centre_punt_de_rosada'),
               states('sensor.soterrani_gran_punt_de_rosada') ]
             | select('is_number') | list | count > 1 }}
        state: >
          {% set v = [ states('sensor.soterrani_fons_punt_de_rosada'),
                       states('sensor.soterrani_centre_punt_de_rosada'),
                       states('sensor.soterrani_gran_punt_de_rosada') ]
                     | select('is_number') | map('float') | list %}
          {{ (v | max - v | min) | round(2) }}

      # ─────────────────────────────────────────────────────────────────────
      #  LA DECISIÓ (sensor.decisio_del_soterrani) ja no és aquí: des del
      #  22/09/2026 és a packages/control.yaml, amb la lògica v2 en una macro
      #  (custom_templates/decisio.jinja) que s'avalua un sol cop.
      # ─────────────────────────────────────────────────────────────────────

# ═════════════════════════════════════════════════════════════════════════════
#  MAGNITUDS QUE HAN DE SOBREVIURE LA PURGA
#
#  ⚠️ Les estadístiques a llarg termini (que no es purguen MAI) només existeixen
#     per a entitats amb state_class i unitat. Un «switch» no en genera cap.
#     Sense aquests dos blocs, passats els dies de retenció la prova que la
#     ventilació estava operativa S'ESBORRA — i és el nucli de la defensa.
#     Vegeu docs/domotica/monitoritzacio.md.
# ═════════════════════════════════════════════════════════════════════════════
utility_meter:
  deshumidificador_diari:
    source: sensor.deshumidificador_energia
    name: Deshumidificador — energia diària
    cycle: daily

  deshumidificador_mensual:
    source: sensor.deshumidificador_energia
    name: Deshumidificador — energia mensual
    cycle: monthly

# ⚠️ `history_stats` és una PLATAFORMA DE SENSOR, no una integració de primer
#    nivell. Escrit com a clau solta («history_stats:») HA no el pot fusionar
#    dins d'un paquet i falla TOT el paquet, no només aquest bloc:
#      «integration 'history_stats' cannot be merged, expected a dict»
#    Va sempre sota «sensor:» amb «platform: history_stats».
sensor:
  - platform: history_stats
    name: Deshumidificador — hores avui
    unique_id: deshumidificador_hores_avui
    entity_id: switch.deshumidificador
    state: "on"
    type: time
    start: "{{ today_at('00:00') }}"
    end: "{{ now() }}"

