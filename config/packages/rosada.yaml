# ═════════════════════════════════════════════════════════════════════════════
#  VIGILÀNCIA DE SENSORS
#  Un sensor mort tres setmanes és un forat de tres setmanes al cas.
# ═════════════════════════════════════════════════════════════════════════════
automation:
  - id: alerta_sensor_ranci
    alias: "Alerta — sensor del cas sense reportar"
    mode: single
    trigger:
      - platform: time_pattern
        hours: "/1"
    condition:
      - condition: template
        value_template: >
          {% set vigilats = [
               'sensor.soterrani_fons_temperatura',
               'sensor.soterrani_centre_temperatura',
               'sensor.soterrani_gran_temperatura',
               'sensor.baixa_temperatura',
               'sensor.exterior_temperatura' ] %}
          {{ vigilats | select('has_value') | list | count < vigilats | count
             or vigilats | map('states') | select('is_number') | list | count < vigilats | count }}
    action:
      - service: persistent_notification.create
        data:
          title: "Sensor del cas sense dada"
          message: >
            {% set vigilats = [
                 'sensor.soterrani_fons_temperatura',
                 'sensor.soterrani_centre_temperatura',
                 'sensor.soterrani_gran_temperatura',
                 'sensor.baixa_temperatura',
                 'sensor.exterior_temperatura' ] %}
            Sense lectura vàlida: {{ vigilats | reject('has_value') | list | join(', ') }}
          notification_id: sensor_ranci
