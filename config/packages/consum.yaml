# ═════════════════════════════════════════════════════════════════════════════
#  CONSUM I COST DE L'ENDOLL — watts, kWh i euros amb els trams de la factura
#  El perquè de cada decisió: docs/local/subministraments.md, «El cost a HA»
#  El calendari i els preus: config/custom_templates/tarifa.jinja (i enlloc més)
#
#  D'ON SURT CADA COSA:
#    W   → sensor.deshumidificador_potencia, tal com la dona l'endoll.
#    kWh → sensor.deshumidificador_energia, el COMPTADOR DE L'ENDOLL. L'endoll
#          integra la potència per dins; HA no integra res. Fer-ho aquí
#          (Riemann sobre els W) seria pitjor: HA només veu la potència quan
#          canvia, i l'informe Matter té un interval mínim.
#    €   → una mostra d'aquell comptador CADA HORA, al segon 59:59.
#
#  PER QUÈ UNA HORA N'HI HA PROU, i és exacte: totes les fronteres de tram de
#  la 2.0TD cauen en hora en punt. Cada hora és sencera d'un sol tram, o sigui
#  que el delta d'una hora té un sol preu. Mostrejar més fi no afinaria el
#  cost —el comptador ja porta tota la resolució—, només gravaria més files.
#  I al 59:59 i no al 00:00 perquè el valor caigui DINS de la franja horària
#  de les estadístiques d'HA: si no, la barra d'euros de les 10 sortiria a les
#  11, desfasada una hora de la d'energia.
#
#  L'ERROR QUE QUEDA: a cada frontera, com a molt el que l'endoll no hagi
#  reportat encara (el comptador va de 0,001 kWh en 0,001 kWh). Menys d'1 Wh
#  mal repartit per frontera. I si hi ha un forat, vegeu reparteix().
#
#  ⚠️ TOT el que hi ha aquí es RECARREGA sense reiniciar HA
#     (homeassistant.reload_custom_templates + template.reload), a posta: es va
#     escriure amb el calibratge en marxa, i un reinici és un forat a les
#     rampes. Per això NO hi ha cap utility_meter nou: un utility_meter només
#     s'aplica reiniciant.
# ═════════════════════════════════════════════════════════════════════════════

template:
  # ───────────────────────────────────────────────────────────────────────────
  #  EL TRAM I EL PREU D'ARA — per veure'ls i per pintar-los sota els watts.
  #  El cost NO els llegeix: avalua el calendari ell mateix per a l'hora que
  #  acaba (vegeu més avall), perquè al 59:59 no hi hagi cap cursa possible
  #  amb el canvi de tram del 00:00.
  # ───────────────────────────────────────────────────────────────────────────
  - sensor:
      - name: "Tarifa — període"
        unique_id: tarifa_periode
        icon: >
          {{ {'punta': 'mdi:cash-remove', 'pla': 'mdi:cash',
              'vall': 'mdi:cash-check'}.get(this.state, 'mdi:cash') }}
        state: >
          {% from 'tarifa.jinja' import tram %}{{ tram(now().timestamp()) | trim }}

      - name: "Tarifa — preu"
        unique_id: tarifa_preu
        # «EUR/kWh» i no «€/kWh»: és el format que el tauler d'Energia d'HA
        # accepta com a entitat de preu, per si algun dia s'hi connecta.
        unit_of_measurement: "EUR/kWh"
        state_class: measurement
        icon: mdi:currency-eur
        availability: >
          {{ states('sensor.tarifa_periode') in ['punta', 'pla', 'vall'] }}
        state: >
          {% from 'tarifa.jinja' import PREUS, IMPOSTOS %}
          {{ (PREUS[states('sensor.tarifa_periode')] * IMPOSTOS) | round(4) }}
        attributes:
          sense_impostos: >
            {% from 'tarifa.jinja' import PREUS %}
            {{ PREUS.get(states('sensor.tarifa_periode')) }}

  # ───────────────────────────────────────────────────────────────────────────
  #  EL COST I L'ENERGIA PER TRAM — una mostra per hora, al 59:59
  #
  #  Quatre acumuladors que no es reinicien mai (el dia, la setmana i el mes
  #  els fan les targetes a partir de les estadístiques, que no es purguen):
  #    sensor.deshumidificador_cost            €
  #    sensor.deshumidificador_energia_punta   kWh
  #    sensor.deshumidificador_energia_pla     kWh
  #    sensor.deshumidificador_energia_vall    kWh
  #
  #  La referència (el comptador i l'hora de l'última mostra) viu als atributs
  #  del sensor de cost. Els sensors per disparador RESTAUREN estat i atributs
  #  en arrencar, de manera que un reinici no perd res: el següent delta surt
  #  de l'última mostra, i si el forat creua trams el reparteix reparteix().
  #  Estat i referència es restauren junts, o sigui que sempre quadren.
  #
  #  ⚠️ Les variables llegeixen el sensor de cost pel seu entity_id perquè
  #     aquí encara no hi ha «this» (és per entitat, i les variables són del
  #     bloc). Si mai es renombra, s'ha de canviar aquí. comprova.sh ho vigila.
  # ───────────────────────────────────────────────────────────────────────────
  - triggers:
      - trigger: time_pattern
        minutes: 59
        seconds: 59
    variables:
      e_ara: "{{ states('sensor.deshumidificador_energia') | float(none) }}"
      e_ref: "{{ state_attr('sensor.deshumidificador_cost', 'kwh_mostra') | float(none) }}"
      # L'instant de la mostra, arrodonit al minut: les 11:00, no les 10:59:59.
      t_ara: "{{ ((now().timestamp() / 60) | round(0)) * 60 }}"
      t_ref: "{{ as_timestamp(state_attr('sensor.deshumidificador_cost', 'mostra'), none) }}"
      # Si el comptador ha baixat de cop, l'endoll l'ha reiniciat: el que
      # marca ara és tot el consumit des del reinici.
      delta: >-
        {%- if e_ara is none or e_ref is none -%}0
        {%- elif e_ara >= e_ref -%}{{ (e_ara - e_ref) | round(6) }}
        {%- else -%}{{ e_ara }}
        {%- endif -%}
      trams: >-
        {% from 'tarifa.jinja' import reparteix %}{{ reparteix(t_ref, t_ara) }}
      preu: >-
        {% from 'tarifa.jinja' import PREUS, IMPOSTOS %}
        {{ (trams.punta * PREUS.punta + trams.pla * PREUS.pla
            + trams.vall * PREUS.vall) * IMPOSTOS }}
    # Sense lectura, o amb el comptador lleugerament enrere (un rebot, no un
    # reinici), no es toca RES: ni l'estat ni la referència. El consum no es
    # perd, el comptarà la mostra següent. Mateixa regla que fa servir HA per
    # als «total_increasing»: baixar menys d'un 10 % no és un reinici.
    conditions:
      - condition: template
        value_template: >
          {{ e_ara is not none
             and (e_ref is none or e_ara >= e_ref or e_ara < 0.9 * e_ref) }}
    sensor:
      - name: "Deshumidificador — cost"
        unique_id: deshumidificador_cost
        unit_of_measurement: "EUR"
        device_class: monetary
        # «total» i no «total_increasing»: HA no admet l'altre per a monetary.
        state_class: total
        icon: mdi:cash-multiple
        # ⚠️ Sis decimals A POSTA. Arrodonir cada suma a 4 esbiaixa: 8 W una
        #    hora en vall són 0,00075 €, i arrodonit a 0,0008 són un 6 % de més
        #    cada hora, sempre cap al mateix costat.
        state: "{{ ((this.state | float(0)) + delta * preu) | round(6) }}"
        attributes:
          kwh_mostra: "{{ e_ara }}"
          mostra: "{{ t_ara | timestamp_local }}"
          ultima_mostra_kwh: "{{ delta }}"
          ultima_mostra_eur: "{{ (delta * preu) | round(6) }}"

      - name: "Deshumidificador — energia (punta)"
        unique_id: deshumidificador_energia_punta
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        icon: mdi:transmission-tower
        state: "{{ ((this.state | float(0)) + delta * trams.punta) | round(6) }}"

      - name: "Deshumidificador — energia (pla)"
        unique_id: deshumidificador_energia_pla
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        icon: mdi:transmission-tower
        state: "{{ ((this.state | float(0)) + delta * trams.pla) | round(6) }}"

      - name: "Deshumidificador — energia (vall)"
        unique_id: deshumidificador_energia_vall
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        icon: mdi:transmission-tower
        state: "{{ ((this.state | float(0)) + delta * trams.vall) | round(6) }}"
